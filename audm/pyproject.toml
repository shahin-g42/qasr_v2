[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audm"
version = "0.1.0"
description = "AUD speech models, selective checkpoint export and distributed fine-tuning"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.10,<3", "transformers>=5.14.1,<5.15", "accelerate>=1.10.1",
  "huggingface-hub", "safetensors>=0.5", "numpy>=2", "librosa>=0.11",
  "soundfile>=0.13", "pyyaml>=6", "scipy>=1.14",
]

[project.optional-dependencies]
train = ["deepspeed>=0.18", "wandb>=0.19", "tqdm>=4.66"]
dev = ["pytest>=8.3", "ruff>=0.16"]
data = ["pyarrow>=17"]

[project.scripts]
audm = "audm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
