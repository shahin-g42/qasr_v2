  zh:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/v7.6/zh/train_zh_q3asr.jsonl
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/q3asr_sft_manifests/zh/train_zh_q3asr.jsonl

language: ar
# Equal languages per mini-batch (6 per language at batch 30) and full coverage
# of every corpus per epoch under the stratified sampler.
sampling_strategy: stratified
min_duration_seconds: 0.1
max_duration_seconds: 35.0
max_target_length: 512

# Full recipe, uniform with Phase 2, so the head learns to draft on the same
# augmented spectrogram distribution the target was trained on.
augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37

# --- Infrastructure ---
deepspeed: configs/deepspeed_zero2.json
bf16: true
tf32: true
# Teacher runs under no_grad, so activation checkpointing has nothing to save.
gradient_checkpointing: false
dataloader_num_workers: 8
logging_steps: 10
# Head saves are ~34 MB. At ~1 s/step, 2,000 steps = ~33 min between saves.
save_steps: 2000
save_total_limit: 8
# Experiment tracking. This was `none`, which left a 2.4M-step run with no graph
# whatsoever -- and EagleTrainConfig had no wandb_project/run_name fields, so
# even flipping it in YAML gave an unnamed run in wandb's default project. Both
# fields now exist and default the way TrainConfig (Phases 1-3) does.
# wandb>=0.19.0 is already a project dependency. WANDB_DIR is pinned node-local
# by the launcher; do not point it at Lustre.
report_to: wandb
wandb_project: qasr-eagle-v76
run_name: eagle_v2_1node_ckpt150k_fullpool
seed: 42
attn_implementation: sdpa
