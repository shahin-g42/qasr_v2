audio_root: null

language: ar
punctuation: true
min_duration_seconds: 0.1
# 35.0 is a hard ceiling, not a preference: qasr.train raises at startup if
# this exceeds the feature extractor's max_audio_clip_s (35.0).
max_duration_seconds: 35.0
max_target_length: 512
truncate_long_transcripts: false
validate_audio_paths: false
eval_log_samples: 10
eval_generation_max_new_tokens: 256

num_train_epochs: 1.0
max_steps: 903217
# 64 devices x 10 samples x 1 accumulation = global batch 640
# (10 = 2 samples per language x 5 languages, per device).
per_device_train_batch_size: 10
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
weight_decay: 0.01
lr_scheduler_type: cosine
lr_scheduler_kwargs: null
warmup_steps: 9000
max_grad_norm: 1.0

# --- Phase A accuracy recipe ---
balanced_sampling: true
# Unused under stratified sampling (kept for config-diff hygiene).
sampling_temperature: 0.5
# Equal languages in every mini-batch AND every record of every language
# seen at least once per epoch (ar exactly once; smaller languages repeat).
sampling_strategy: stratified
# Only the projector trains here, so the per-group split is inert. Pinned to
# 1.0 anyway so the logged optimizer groups read honestly.
llm_lr_factor: 1.0
embed_lr_factor: 1.0
# No smoothing while the projector is finding the embedding space; a raw
# likelihood signal converges faster and this stage is not the one that
# overfits.
label_smoothing: 0.0
non_speech_manifest: null
ctc_loss_weight: 0.0
eval_wer_samples_per_language: 100

logging_steps: 10
eval_steps: 20000
save_steps: 60000
save_total_limit: 8

smoke_test: false
smoke_test_max_steps: 2
smoke_test_train_samples: 256
smoke_test_eval_samples: 16

dataloader_num_workers: 8
dataloader_pin_memory: true
dataloader_persistent_workers: true

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
torch_compile: false
optim: adamw_torch

deepspeed: configs/deepspeed_zero2.json
ddp_find_unused_parameters: false
report_to: wandb
wandb_project: qasr
run_name: qasr-v76-p1-projector
seed: 42
data_seed: 42

resume_from_checkpoint: null
attn_implementation: sdpa

# Augmentation stays ON, matching Phase 2. The projector should learn to align
# the same augmented spectrogram distribution the full fine-tune will present,
# not a clean one it never sees again.
augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37
