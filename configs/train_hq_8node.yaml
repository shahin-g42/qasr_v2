# Phase 4 (optional) — high-quality fine-tune stage on 8 nodes x 64 GPUs.
# Canary §4.3 pattern: short polish on curated high-quality data with equal
# hours-per-language caps (apply the caps in the manifests before launching),
# 10k steps, lr 2e-5, inverse_sqrt schedule, no warmup.
# Ordering rule: this changes target weights -> retrain the EAGLE head
# (Phase 3) AFTER this stage, then re-run the full eval sweep.
model_name_or_path: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/full_v2/best
freeze_audio_tower: false
freeze_language_model: false

# Curated HQ manifests with equal hours-per-language caps. Replace these
# placeholder paths with the assembled HQ snapshot before launching.
train_manifest:
  ar:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/hq_v1/train_hq_ar.jsonl
  en:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/hq_v1/train_hq_en.jsonl
  zh:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/hq_v1/train_hq_zh.jsonl
  hi:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/hq_v1/train_hq_hi.jsonl
  ml:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/hq_v1/train_hq_ml.jsonl

eval_manifest:
  ar:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ar_inworld.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ar_ar_ae.json
  en:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_en_inworld.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_en_expresso.json
  ml:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ml_inworld.json
  zh:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_zh_inworld.json
  hi:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_hi_inworld.json

audio_root: null

language: ar
punctuation: true
min_duration_seconds: 0.1
max_duration_seconds: 35.0
max_target_length: 512
truncate_long_transcripts: false
validate_audio_paths: false
eval_log_samples: 10
eval_generation_max_new_tokens: 256

num_train_epochs: 1.0
max_steps: 10000
# 64 devices x 2 samples x 1 accumulation = global batch size 128 (smaller
# batch for the polish stage; HQ data is scarce by design).
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.01
# inverse_sqrt with no warmup (Canary HQ FT pattern).
warmup_steps: 0
lr_scheduler_type: inverse_sqrt
max_grad_norm: 1.0

# Balanced sampling stays on; with equal-hour caps it is near-uniform already.
balanced_sampling: true
sampling_temperature: 0.5
llm_lr_factor: 0.5
embed_lr_factor: 0.25
label_smoothing: 0.1
non_speech_manifest: null
ctc_loss_weight: 0.0
eval_wer_samples_per_language: 100

logging_steps: 10
eval_steps: 1000
save_steps: 2500
save_total_limit: 6

smoke_test: false
smoke_test_max_steps: 2
smoke_test_train_samples: 256
smoke_test_eval_samples: 16

dataloader_num_workers: 8
dataloader_pin_memory: true
dataloader_persistent_workers: true

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
torch_compile: false
optim: adamw_torch

deepspeed: configs/deepspeed_zero2.json
ddp_find_unused_parameters: false
report_to: wandb
wandb_project: qasr
run_name: qasr-hq-8node-v1
seed: 42
data_seed: 42

resume_from_checkpoint: null
output_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/full_v2_hq
attn_implementation: sdpa

# Data augmentation (applied during training only) — full recipe,
# uniform with Phase 2, so HQ polish keeps the robustness the base
# model earned instead of overfitting to clean studio audio.
augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37
