# Same benchmark/inference settings; remote preparation needs no local dataset roots.
format_version: 1
audio_input: stream
work_dir: ${GQASR_BENCH_WORK}
checkpoint: ${GQASR_BENCH_CHECKPOINT}
output_dir: ${GQASR_BENCH_OUTPUT}
precision: bf16
max_new_tokens: 768
task_size: 4
simultaneous_model_loads: 4
startup_timeout_seconds: 1800
progress_timeout_seconds: 1800
duration_tolerance_seconds: 0.25
datasets:
  sada: {}
  commonvoice: {}
  masc_clean: {}
  masc_noisy: {}
  mgb2: {}
  casablanca: {}
