# =============================================================================
# QASR v7.6 — PHASE 2: full fine-tune (all 3.62B params trainable)
# 8 nodes x 8 GPUs = 64 GPUs. Global batch: 64 x 20 x 1 = 1,280.
# =============================================================================
# The main run. Everything unfrozen, full augmentation, both data sources.
#
# DATA — two sources are deliberately stacked:
#   1. training_manifests/v7.6/  — LLM-cleaned (ITN, punctuation, Arabic
#      dialect + diacritic restoration). 46 corpora, ~115.4M records.
#   2. q3asr_sft_manifests/      — raw q3asr envelopes filtered by
#      prepare_q3asr_filter (LID, duration probe, 512-token gate).
#      ~61.1M train records, and fully duration-complete.
# These overlap on the q3asr audio. That is intentional and accepted: the
# augmentation stack (speed 0.85-1.15x, MUSAN noise 5-20 dB, codec, SpecAugment,
# each p=0.37) makes repeat views of the same utterance distinct, and the
# cleaned/raw pair gives the model both a normalized and a verbatim target for
# the same audio. Combined pool ~176.5M records.
#
# STEP BUDGET — 451,609 x 1,280 = 578.1M samples = ONE full stratified epoch:
# each of the 5 languages contributes 115.6M draws (the size of Arabic, the
# largest). Every record of every language is seen at least once — Arabic
# exactly once; en x2.4, hi x10.2, ml x94, zh x213 (augmentation makes the
# repeat views distinct). This is a guarantee from the sampler's bijective
# per-rank partition, not a statistical estimate.
#
# Input model: .../output/v76/projector (Phase 1)
# Output: .../output/v76/full  ->  consumed by 03_hq_8node.yaml
# -----------------------------------------------------------------------------
model_name_or_path: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/v76/projector
output_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/v76/full

