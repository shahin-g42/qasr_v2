# Sequential corpus build configuration.
#
# Emits batches of exactly `batch_size` unique samples per language, labelled
# b0000, b0001, ... Uniqueness is on `audio_filepath` alone and holds across
# batches and across runs, enforced by the SQLite ledger.
#
# Run it:
#   PYTHONPATH=src python3 -m data_processing.build_corpus --config configs/corpus.yaml --dry-run
#   PYTHONPATH=src python3 -m data_processing.build_corpus --config configs/corpus.yaml
#
# Every key here is overridable on the command line; CLI wins.

build:
  out_dir: training_manifests/v8.0
  ledger: logs/corpus_ledger.sqlite3
  langs: [ar, en, zh, hi, ml]

  # Batches per language. 0 drains the sources and allows a short final batch;
  # any positive number holds a short trailing batch open instead of writing it,
  # so a partial shard can never silently break the 100k contract.
  batches_per_lang: 1

  # Root for the registry's relative local patterns. The internal specs store
  # "<lang>/*.jsonl", NOT "<root>/<lang>/*.jsonl" -- joining an already-rooted
  # pattern with the root matches nothing, which preflight will tell you.
  root: training_manifests/v7.6

  # Sources whose Hub terms must be accepted. Set false for a first end-to-end
  # run with no HF_TOKEN: note that hi then has ~12 est. hours available and ml
  # ~34, so neither can fill a 100k batch without gated access.
  include_gated: true

  # Restrict to named registry entries. Empty = everything. Useful for testing
  # one source: --only internal_v76_ar
  only_sources: []

  gzipped: false
  dry_run: false

  # Load every eval_*.jsonl under `root` into the ledger as exclusions before
  # building. This is what makes the measured ar leak (962 of 21,867 eval paths
  # also present in train) structurally impossible rather than merely unlikely.
  exclude_eval: true

  # --- LLM correction stage -------------------------------------------------
  # Null means deterministic-only: normalize, gate, tag and distribute with no
  # model in the loop. That path is complete and testable without a GPU, and
  # running it first tells you how much the LLM would actually change.
  llm_url: null
  llm_model: corrector

  # Transcripts per call. At ~33 output tokens each, one call per sample spends
  # most of its budget re-reading the system prompt. 64 concurrent calls x 16
  # transcripts keeps ~1k transcripts in flight against a vLLM
  # max_num_seqs=512 (the corrector container's setting).
  llm_batch: 16
  llm_concurrency: 64

  # Prompt family for the corrector: rich (language-specialized cleaner
  # prompts, the default everywhere) or compact (short fallback). Same
  # deterministic enforcement in both modes.
  llm_prompt: rich

  # Send only samples the deterministic stage could not settle. Measured on
  # 60,000 real records this is ~18% of traffic (ar 8.5%, ml 8.7%, zh 37.2%).
  llm_triage_only: true

  # --- deterministic normalization ------------------------------------------
  # CRITICAL_ONLY keeps shadda and tanween, strips the rest. PRESERVE_ALL keeps
  # every diacritic; STRIP_ALL removes all. Diacritics carry meaning in Arabic,
  # so STRIP_ALL is for corpora known to be inconsistently vocalized.
  diacritic_policy: critical_only

  quality:
    min_duration: 0.5
    max_duration: 30.0
    min_text_chars: 2
    max_text_chars: 2000
    min_script_ratio: 0.80
    max_diacritics_ratio: 0.40
    max_char_run: 4
    max_word_fraction: 0.50

  distribute:
    batch_size: 100000
    # No single source may exceed this share of a batch. Without it a batch
    # drains whichever source streams first and "distributed" becomes
    # "one dataset, sequentially".
    max_per_source_fraction: 0.40
    # Renditions of one transcript allowed per language. audio_filepath is the
    # identity key, so this is a diversity cap, NOT deduplication -- it is what
    # stops 7,851 transcripts re-entering as 156,540 "unique" records.
    max_per_text: 2
    # A batch below this distinct-transcript fraction is refused outright.
    min_distinct_text_fraction: 0.50

# ----------------------------------------------------------------------------
# Staged 9-node build sections.
#
# The dispatcher feeds a stage's section as DEFAULTS when you run
#   python3 -m data_processing.build_corpus <stage> [flags...]
# by prepending them as flags; explicit CLI flags still win (argparse takes the
# last occurrence). Keys are the stage's flag names. Set a key to null to
# disable a default. The sections are checked by a test: every key must be a
# flag the stage actually declares -- a knob nothing reads is worse than no
# knob.
#
# `paths:` below is NOT injected into stages: paths are per-invocation
# (drivers pass them from the environment; several need per-language joins).
# It is the documented record the drivers and scripts/corpus/env.sh mirror.
# ----------------------------------------------------------------------------

prepare:
  # Spawned workers on the 96-core nodes. More workers than the node has
  # sources split each local source into byte-range chunks, so a
  # single-source rank still fills its cores.
  jobs: 80
  min_richness: 0.0
  gate_duration: false

assemble:
  # The corrector is co-located on every node (persistent container, port 8010).
  # Set llm_url to null for a deterministic-only assemble.
  llm_url: http://localhost:8010/v1
  llm_model: corrector
  llm_prompt: rich
  llm_batch: 16
  llm_concurrency: 64
  # Parallel external-audio prefetch threads (0 = serial inline fetch).
  fetch_workers: 16
  # 0 = drain the pool (writes a short trailing batch). The ledger continues
  # batch indices across runs, so later runs append b0001... and grow K.
  batches: 0
  exclude_eval: true

materialize:
  sample_rate: 16000
  # I/O-bound fetch/decode threads; 96 cores allow 32-64.
  workers: 32

bundle:
  langs: [ar, en, zh, hi, ml]
  # 0 = verify every external clip; N = deterministic spot-check for fast re-runs.
  spot_check: 0

paths:
  # Shared (relative to the repo root on shared storage, $QASR in the drivers).
  # Both internal trees are named file-for-file in
  # configs/v7.6/internal_ds_sources.yaml; on the cluster they live in the
  # training checkout (train/stt/qasr), which env.sh points at.
  internal_root: training_manifests/v7.6
  # SECOND internal tree (registry $QASR_SFT_ROOT / internal_sft_* specs);
  # stages 2 + 4 also pass it as --eval-root for the leak gates.
  sft_root: q3asr_sft_manifests
  pool_dir: corpus/pool
  audio_root: corpus/audio
  out_dir: training_manifests/v8.0
  # SQLite-WAL ledgers: one writer per ledger file, ever. Node-local disk is
  # still preferred when the node has it (env.sh LEDGER_DIR mirrors this);
  # /scratch is not creatable on this cluster, so the scratch area -- and
  # this default -- lives in the workspace.
  ledger_dir: scratch/corpus/ledgers
  logs: logs/corpus
