# =============================================================================
# QASR v7.6 — PHASE 1: multimodal projector warm-up
# 8 nodes x 8 GPUs = 64 GPUs. Global batch: 64 x 10 x 1 = 640.
# =============================================================================
# Trains ONLY the multimodal projector (~4.26M params); the Conformer encoder
# and the Qwen3 decoder stay frozen. Goal is to land audio embeddings inside
# the LLM's input distribution before anything else is allowed to move.
#
# DATA — the FULL v7.6 + q3asr-SFT pool, identical to Phase 2. Under
# `sampling_strategy: stratified` the epoch layout is driven by record counts,
# not hours, so the old reason to exclude the undated q3asr corpora from this
# phase (hours-weighted sampling misjudging the mix) no longer applies. One
# full stratified epoch: every record of every language is seen at least once;
# Arabic — the largest — exactly once; smaller languages repeat to fill their
# equal per-batch share.
#
# STEERING NOTE — the projector (a 4.3M-param MLP) typically converges within
# the first few tens of thousands of steps. The full-epoch budget below is the
# guarantee, not a requirement to burn: if eval loss is flat for 3 consecutive
# evals, stop and hand the checkpoint to Phase 2.
#
# Input model: the converted encoder+decoder checkpoint from qasr.convert_weights.
# Output: .../output/v76/projector  ->  consumed by 02_full_8node.yaml
# -----------------------------------------------------------------------------
# The converted (encoder+decoder welded) checkpoint from qasr.convert_weights.
# This is the existing conversion the original runs trained from. To use a
# fresh conversion in your own tree instead, run convert_weights (its default
# output is .../train/stt/qasr/output/initial) and repoint this line.
model_name_or_path: /lustrefs/shared/mohammed.naseem/workspace/expmt/qasr/initial
output_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/v76/projector

freeze_audio_tower: true
freeze_language_model: true

