# Projector warm-up stage for 4 nodes x 8 GPUs per node (32 GPUs total).
# Run qasr-convert before launching this config.
# Global batch: 32 devices x 4 samples x 1 accumulation = 128.
model_name_or_path: /lustrefs/shared/mohammed.naseem/workspace/expmt/qasr/initial
freeze_audio_tower: true
freeze_language_model: true

train_manifest:
  ar:
    - /lustrefs/shared/mohammed.naseem/data/asr/q3asr/train_filter_ar.json
    - /lustrefs/shared/mohammed.naseem/data/asr/AR-AE/manifest_all.json
    - /lustrefs/shared/mohammed.naseem/data/YT/Camel_Race/manifest.json
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/asr_ar_full/train_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/qudratech_synthetic_batch2/train_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/qudratech_synthetic_phase_4_2/train_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/Khalid_msa_qudratech_batch_1/train_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/English/ar_el_gen_v5/manifest.json
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/EL_AR_v1/manifest_all.json
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/ar_se_v1/manifest.json
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/ar_spotify_v1/manifest.json
    - /lustrefs/shared/mohammed.naseem/data/AR-AE/manifest_asr_ar_24k_partial_dialect_qwen_gulf.json
    - /lustrefs/shared/mohammed.naseem/data/AR-AE/manifest_all_train.json
  en:
    - /lustrefs/shared/mohammed.naseem/data/asr/q3asr/train_filter_en.json
    - /lustrefs/shared/mohammed.naseem/data/YT/English_Commentary/manifest_speaker.json
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/en/train_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/English/manifest_expresso_conversational.json
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/English/manifest_anispeech.json
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/Hi_fi_tts_44k/manifest.json
  zh:
    - /lustrefs/shared/mohammed.naseem/data/asr/q3asr/train_filter_zh.json
  hi:
    - /lustrefs/shared/mohammed.naseem/data/asr/q3asr/train_filter_hi.json
  ml:
    - /lustrefs/shared/mohammed.naseem/data/tts/44k/manifest_all/all/malayalam/manifest_itn_with_punctuation.json
eval_manifest:
  ar:
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/asr_ar_full/val_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/AR-AE/manifest_all_val.json
  en:
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/en/val_samples.jsonl
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/en_expresso/val_samples.jsonl
  ml:
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/data_hi_ml/val_samples.jsonl
  zh:
    - /lustrefs/shared/mohammed.naseem/data/tts/inworld-tts/data_zh/val_samples.jsonl
audio_root: null

language: ar
punctuation: true
min_duration_seconds: 0.1
max_duration_seconds: 35.0
max_target_length: 512
truncate_long_transcripts: false
validate_audio_paths: false
eval_log_samples: 10
eval_generation_max_new_tokens: 256

num_train_epochs: 1.0
max_steps: 5000
# 32 devices x 4 samples x 1 accumulation = global batch size 128.
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_steps: 500
lr_scheduler_type: cosine
max_grad_norm: 1.0

logging_steps: 10
eval_steps: 2500
save_steps: 2500
save_total_limit: 5

smoke_test: false
smoke_test_max_steps: 2
smoke_test_train_samples: 256
smoke_test_eval_samples: 16

dataloader_num_workers: 8
dataloader_pin_memory: true
dataloader_persistent_workers: true

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
torch_compile: false
optim: adamw_torch

# Four-node, eight-GPU-per-node ZeRO-3 without CPU parameter or optimizer offload.
deepspeed: configs/deepspeed_zero3.json
ddp_find_unused_parameters: false
report_to: wandb
wandb_project: qasr
run_name: qasr-projector-4node
seed: 42
data_seed: 42

resume_from_checkpoint: null
output_dir: /lustrefs/shared/shahin.konadath/workspace/expmt/qasr/projector
attn_implementation: sdpa

# Data augmentation (applied during training only) — identical to the
# Phase 2 recipe so the projector learns the bridge on the same distorted
# audio distribution it will serve during full fine-tune.
augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37
