# Full fine-tuning stage for 8 nodes x 8 GPUs per node (64 GPUs total).
# Uses VALIDATED and FILTERED manifests for clean training data.
# Global batch: 64 devices x 8 samples x 1 accumulation = 512.
# Schedule: 250K steps x 512 = 128M samples ~= 1.17 epochs over the ~110M-sample
# corpus (~214.5K steps/epoch). Full coverage plus a light second-pass
# reinforcement, safely below the noisy-label memorization boundary (~2 epochs).
# Phase A accuracy recipe: balanced sampling (hours^0.5), per-group LR split
# (4e-5 / 2e-5 / 1e-5), WSD schedule, label smoothing 0.1, WER eval callback.
# Input = Phase 1 output (deep-projector warm-up, output/projector_v2).
model_name_or_path: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/projector_v2
freeze_audio_tower: false
freeze_language_model: false

# Validated manifests base path
# All manifests filtered through qasr.validate_data
train_manifest:
  ar:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_q3asr.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_ar_ae.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_camel_race.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_inworld_full.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_qudratech_batch2.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_qudratech_phase4.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_khalid_msa.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_el_gen_v5.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_el_ar_v1.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_se_v1.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_spotify_v1.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_dialect_gulf.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ar_ar_ae_train.json
  en:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_q3asr.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_commentary.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_inworld.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_expresso.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_anispeech.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_en_hifi_tts.json
  zh:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_zh_q3asr.json
  hi:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_hi_q3asr.json
  ml:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/train_ml_itn_punct.json

eval_manifest:
  ar:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ar_inworld.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ar_ar_ae.json
  en:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_en_inworld.json
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_en_expresso.json
  ml:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_ml_inworld.json
  zh:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_zh_inworld.json
  hi:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/validated_manifests/eval_hi_inworld.json

audio_root: null

language: ar
punctuation: true
min_duration_seconds: 0.1
max_duration_seconds: 35.0
max_target_length: 512
truncate_long_transcripts: false
validate_audio_paths: false
eval_log_samples: 37
eval_generation_max_new_tokens: 256

num_train_epochs: 1.0
# 250,000 steps ~= 1.17 epochs at global batch 512; warmup = 0.6% of max_steps.
max_steps: 250000
# 64 devices x 8 samples x 1 accumulation = global batch size 512.
per_device_train_batch_size: 8
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
# sqrt(2) scaling from 3.0e-5 (batch 256) → 4.24e-5 ≈ 4.0e-5.
# Peak VRAM ~50 GB/GPU with ~30 GB headroom on H100-80GB.
# Per-group split (see llm_lr_factor / embed_lr_factor below):
#   encoder + projector: 4.0e-5 | LLM body: 2.0e-5 | token embeddings: 1.0e-5.
learning_rate: 4.0e-5
weight_decay: 0.01
# Warmup-Stable-Decay: 1.5k warmup, 20k decay tail, stable plateau in between.
# Steering rule: if per-language WER flattens for 2 consecutive evals in the
# stable region, stop and fire the decay branch from the best checkpoint.
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 20000
  min_lr_ratio: 0.1
warmup_steps: 1500
max_grad_norm: 1.0

# --- Phase A accuracy recipe ---
# Language-balanced sampling: draw weight per language proportional to
# hours^0.5 so ml/hi are not starved by naive concatenation.
balanced_sampling: true
sampling_temperature: 0.5
# Per-group learning rates: LLM body and tied embeddings train slower than the
# encoder/projector to protect Qwen3's text priors from drift.
llm_lr_factor: 0.5
embed_lr_factor: 0.25
# Label smoothing for the causal LM loss (custom loss_function swap).
label_smoothing: 0.1
# Non-speech / silence manifests (anti-hallucination). Set once the silence
# manifests are assembled; do not block the run on them, a follow-up run can
# absorb them. Example:
#   non_speech_manifest:
#     ar: [ .../training_manifests/v1/silence/train_silence_ar.jsonl ]
non_speech_manifest: null
# CTC auxiliary head (Tier B scaffold): 0 disables. Enable with 0.3 for the
# phase-2 experiment after the Phase A run lands.
ctc_loss_weight: 0.0
# Per-language WER/CER eval callback (rank 0, fixed sample subset).
eval_wer_samples_per_language: 100

logging_steps: 10
eval_steps: 5000
# Step-budget discipline: keep every 25k-step checkpoint until selection is
# done; save_total_limit 6 retains 150k steps of checkpoints.
save_steps: 25000
save_total_limit: 6

smoke_test: false
smoke_test_max_steps: 2
smoke_test_train_samples: 256
smoke_test_eval_samples: 16

dataloader_num_workers: 8
dataloader_pin_memory: true
dataloader_persistent_workers: true

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
torch_compile: false
optim: adamw_torch

# Eight-node, eight-GPU-per-node ZeRO-2: params stay resident on each GPU
# (7.2 GB in BF16), eliminating per-layer all-gather overhead vs ZeRO-3.
deepspeed: configs/deepspeed_zero2.json
ddp_find_unused_parameters: false
report_to: wandb
wandb_project: qasr
run_name: qasr-full-8node-v2-phaseA
seed: 42
data_seed: 42

resume_from_checkpoint: null
output_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/output/full_v2
attn_implementation: sdpa

# Data augmentation (applied during training only).
augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37
