[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qasr-lab"
version = "0.1.0"
description = "Isolated evaluation and controlled adaptation experiments for QASR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=2", "scipy>=1.14", "soundfile>=0.13"]
hf = ["torch>=2.10", "transformers>=5.14.1,<5.15", "accelerate>=1.10", "librosa>=0.11", "safetensors>=0.5", "numpy>=2", "scipy>=1.14", "soundfile>=0.13", "PyYAML>=6"]
dev = ["pytest>=8.3", "ruff>=0.16"]

[project.scripts]
qasr-lab = "qasr_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qasr_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_models.py" = ["E402"]
