[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qasr"
version = "0.2.0"
description = "Cohere Conformer and Qwen3-ASR hybrid training pipeline with EAGLE-2 speculative decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.10.1",
    "httpx>=0.27.0",
    "huggingface-hub",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "protobuf>=5.29.0",
    "pyyaml>=6.0.2",
    "scipy>=1.14.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.13.1",
    "torch==2.10.0",
    "tqdm>=4.66.0",
    "transformers>=5.14.1,<5.15",
    "safetensors>=0.5.0",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
# HF `datasets` powers Hub streaming ingest (Phase A metadata for the 20+
# remote specs). It is an extra, not a core dep: it pulls pyarrow/pandas/dill
# and the local-JSONL v7.6 path never imports it. require_datasets() names the
# same install, so a missing extra fails with this command rather than a bare
# ImportError mid-download.
datasets = ["datasets>=3.0", "huggingface-hub[hf_transfer]"]
deepspeed = ["deepspeed>=0.18.0"]
dev = ["pytest>=8.3.0", "ruff>=0.16"]
streaming = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[project.scripts]
qasr-train = "qasr.train:main"
qasr-train-eagle = "qasr.train_eagle:main"
qasr-convert = "qasr.convert_weights:main"
qasr-stream = "qasr.server:main"
qasr-validate = "qasr.validate_data:main"
qasr-evaluate = "qasr.evaluate:main"
qasr-process = "data_processing.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qasr", "src/data_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # long lines are common in prompt/config literals
    "RUF001", "RUF002", "RUF003",  # Arabic/diacritic characters are the domain
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # assertRaises(Exception) is intentional in crash tests
