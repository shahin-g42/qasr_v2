[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-core"
version = "0.1.0"
description = "Standalone candidate-conditioned JEV decision model"
requires-python = ">=3.12"
dependencies = [
  "jev-contracts>=0.1.0,<0.2",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
# Qualification candidates, not a runtime-certification claim.
train = ["torch>=2.13,<3", "transformers>=5.17,<6"]

[project.scripts]
jev-train = "jev.train:main"
jev-eval = "jev.evaluate:main"
jev-calibrate = "jev.calibrate:main"
jev-export = "jev.export:main"

[tool.uv.sources]
jev-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]
