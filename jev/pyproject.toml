[project]
name = "jev-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/data", "packages/core"]

[tool.uv.sources]
jev-contracts = { workspace = true }
jev-data = { workspace = true }
jev-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/contracts/src", "packages/data/src", "packages/core/src"]
addopts = "--import-mode=importlib -ra"
consider_namespace_packages = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/contracts/src", "packages/data/src", "packages/core/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["jev_contracts", "jev_data", "jev"]
