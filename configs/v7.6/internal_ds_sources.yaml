audio_root: null

language: ar
punctuation: true
min_duration_seconds: 0.1
max_duration_seconds: 35.0
max_target_length: 512
truncate_long_transcripts: false
validate_audio_paths: false
eval_log_samples: 37
eval_generation_max_new_tokens: 256

num_train_epochs: 1.0
max_steps: 451609
# 64 devices x 20 samples x 1 accumulation = global batch 1,280
# (20 = 4 samples per language x 5 languages, per device).
# MEMORY GATE — rehearse on ONE node before the 64-GPU launch:
#   CONFIG=configs/v7.6/02_full_8node.yaml NNODES=1 \
#     bash scripts/run_v76_phase1_node.sh 0 localhost --smoke-test
# then watch nvidia-smi peak. Estimated 55-65 GB/GPU (fp32 loss logits alone
# are ~12 GB at this batch). If it OOMs or peaks >70 GB, fall back:
#   15/device -> max_steps 602,145 (gb 960),  lr 5.0e-5, warmup 6000
#   10/device -> max_steps 903,217 (gb 640),  lr 4.0e-5, warmup 9000
per_device_train_batch_size: 20
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
# sqrt-scaled for global batch 1,280: 4.0e-5 x sqrt(1280/640) ~= 5.7e-5,
# held to 4.5e-5 on the conservative side (WSD keeps it at peak for most of
# the run). Per-group split (see llm_lr_factor / embed_lr_factor):
#   encoder + projector 4.5e-5 | LLM body 2.25e-5 | token embeddings 1.125e-5.
learning_rate: 4.5e-5
weight_decay: 0.01
# Warmup-Stable-Decay: 4.5k warmup (~1%), 45k decay tail (~10%), stable plateau between.
# Steering rule: if per-language WER flattens for 2 consecutive evals in the
# stable region, stop and fire the decay branch from the best checkpoint.
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 45000
  min_lr_ratio: 0.1
warmup_steps: 4500
max_grad_norm: 1.0

# --- Phase A accuracy recipe ---
balanced_sampling: true
# Unused under stratified sampling (kept for config-diff hygiene).
sampling_temperature: 0.5
# Equal languages in every mini-batch AND every record of every language
# seen at least once per epoch (ar exactly once; smaller languages repeat).
sampling_strategy: stratified
llm_lr_factor: 0.5
embed_lr_factor: 0.25
label_smoothing: 0.1
non_speech_manifest: null
ctc_loss_weight: 0.0
eval_wer_samples_per_language: 100

logging_steps: 10
eval_steps: 10000
save_steps: 30000
save_total_limit: 8

smoke_test: false
smoke_test_max_steps: 2
smoke_test_train_samples: 256
smoke_test_eval_samples: 16

dataloader_num_workers: 12
dataloader_pin_memory: true
dataloader_persistent_workers: true

gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
torch_compile: false
optim: adamw_torch

# ZeRO-2: params stay resident per GPU (7.2 GB BF16), avoiding the per-layer
# all-gather overhead of ZeRO-3.
deepspeed: configs/deepspeed_zero2.json
ddp_find_unused_parameters: false
report_to: wandb
wandb_project: qasr
run_name: qasr-v76-p2-full
seed: 42
data_seed: 42

resume_from_checkpoint: null
attn_implementation: sdpa

augmentation:
  spec_augment:
    enabled: true
    num_time_masks: 2
    max_time_mask_ratio: 0.05
    num_freq_masks: 2
    max_freq_mask_ratio: 0.15
    p: 0.37
  speed_perturb:
    enabled: true
    rate_range: [0.85, 1.15]
    p: 0.37
  noise_injection:
    enabled: true
    noise_dir: /lustrefs/shared/shahin.konadath/workspace/train/stt/musan
    snr_range: [5.0, 20.0]
    p: 0.37
  codec_augment:
    enabled: true
    p: 0.37
