# --- Eval sets ---
# ar/en/zh use the v7.6 CLEANED eval sets, so the reference style matches the
# dominant training target (ITN'd + punctuated) and eval loss stays meaningful.
# hi/ml use the q3asr SFT eval sets because v7.6 has nothing usable for them:
# eval_ml_inworld.jsonl is 46 records, and eval_ml_inworld_as_hi.jsonl (98
# records) is Malayalam audio filed under Hindi. Those two languages therefore
# score against RAW references — track them over time, but do not compare their
# absolute WER against ar/en/zh.
# v7.6's eval_en_expresso.jsonl (16 records) is omitted as statistical noise.
eval_manifest:
  ar:
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/v7.6/ar/eval_ar_inworld.jsonl
    - /lustrefs/shared/shahin.konadath/workspace/train/stt/qasr/training_manifests/v7.6/ar/eval_ar_ar_ae.jsonl
