[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gqasr-training"
version = "0.1.0"
description = "Standalone GQASR training runtime; no TTS or benchmark dependencies"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.13,<3", "transformers>=5.20.2,<6", "safetensors>=0.8,<1",
  "numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1",
  "librosa>=0.11,<1", "pyyaml>=6,<7", "wandb>=0.19,<1",
]

[project.scripts]
gqasr = "gqasr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gqasr*"]
