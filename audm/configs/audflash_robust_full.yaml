# 1 node x 8 GPUs. 40 x 2 = 80 examples/GPU/update (four 20-example quota windows).
data_recipe: ../../configs/v8.1/02_full_12node.yaml
stage: full
# Temporarily exclude Chinese from loss, WER/CER and prediction examples; retain training.
evaluation:
  exclude_languages: [zh]
training:
  # Gemma audio context: filter longer recordings without truncation.
  max_duration_seconds: 30.0
  # Optional code-switch mixing is disabled by default.
  code_switch_index: null
  code_switch_probability: 0.0
  per_device_train_batch_size: 40
  per_device_eval_batch_size: 40
  gradient_accumulation_steps: 2
  num_train_epochs: 3.0
  max_steps: -1
  learning_rate: 2.0e-05
  llm_lr_factor: 0.5
  embed_lr_factor: 0.25
  weight_decay: 0.01
  warmup_steps: 500
  lr_scheduler_type: cosine
  label_smoothing: 0.1
  logging_steps: 10
  eval_steps: 3700
  save_steps: 3700
  save_total_limit: 4
  eval_log_samples: 2
  eval_generation_max_new_tokens: 768
  eval_wer_samples_per_language: 100
  dataloader_num_workers: 4
  dataloader_persistent_workers: true
  dataloader_pin_memory: true
  gradient_checkpointing: true
  bf16: true
  fp16: false
  tf32: true
  attn_implementation: sdpa
  deepspeed: deepspeed_zero2.json
  expected_world_size: 8
  report_to: wandb
  wandb_project: audm
  seed: 42
  data_seed: 42
  ctc_loss_weight: 0.0
  run_name: audflash-full-robust-1node

# Opt-in experiment: set both manifest environment variables before preflight.
robustness:
  non_speech:
    probability: 0.03
    manifests: ["${AUD_NON_SPEECH_MANIFEST}"]
  augmentation:
    clean_probability: 0.20
    max_effects: 2
    effects:
      speed: {p: 0.20}
      time_stretch: {p: 0.15, rate: [0.9, 1.1]}
      silence: {p: 0.20, start_ms: [0, 100], end_ms: [0, 100]}
      shift: {p: 0.15, max_ms: 5, boundary_peak: 0.001}
      rir: {p: 0.20, manifest: "${AUD_RIR_MANIFEST}"}
      noise: {p: 0.25}
      gain: {p: 0.25, db: [-6, 6]}
      white_noise: {p: 0.10, db: [-70, -46]}
      transcode: {p: 0.10, codecs: [opus, aac, mp3, g711]}
      # Optional experiments; enable individually after an accuracy/performance ablation.
      pitch: {p: 0.0, semitones: [-1, 1]}
      clipping: {p: 0.0, peak_fraction: [0.7, 0.95]}
      dropout: {p: 0.0, duration_ms: [5, 20], max_drops: 2, max_fraction: 0.01}
      compression: {p: 0.0, threshold_db: [-24, -12], ratio: [2, 4], attack_ms: 5, release_ms: 50}
